general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = hyprlock                 # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on displays when waking up
}

# Lock screen after 30 seconds of inactivity
listener {
    timeout = 300                                # 30 seconds
    on-timeout = hyprlock                       # directly call hyprlock
}

# Turn off displays after 60 seconds of inactivity (optional)
listener {
    timeout = 600                                # 1 minute
    on-timeout = hyprctl dispatch dpms off      # turn off displays
    on-resume = hyprctl dispatch dpms on        # turn on displays when active
}
